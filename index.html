<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Relatório de Palestras</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon2-192.png">
  <meta name="theme-color" content="#ffffff">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      padding: 15px;
      font-size: 16px;
      font-weight: bold;
      max-width: 900px;
      margin: auto;
      color: #132c0d;
      background-color: #0088FF;
    }
    .topo{
    background:#ffffff;
    border-radius:12px;
    box-shadow:0 6px 20px rgba(0,0,0,.15);
    padding:15px;
    text-align:center;
    margin-bottom:20px;
}

.logo-prefeitura img{ width:75px; }

.topo h1{
    font-size:24px;
    color:#153654;
    line-height:1.15;
    
}

.topo h2{
    font-size:18px;
    color:#666;
    font-weight:normal;
}


    .linha-horizontal, .linha-horizontal-2, .linha-horizontal-3 {
      display: flex; gap: 10px; flex-wrap: wrap; margin-top: 1px;
    }
    .linha-horizontal label, .linha-horizontal-2 label, .linha-horizontal-3 label {
      flex: 1; min-width: 180px;
    }
    label { display: block; margin-top: 7px; }
    input[type="text"], input[type="date"], input[type="time"], textarea {
      width: 100%; padding: 5px; font-weight: bold; font-size: 15px;
      color: blue; border-radius: 8px; border: 1.5px solid #48648a;
    }
    textarea {
      height: auto; min-height: 225px; color: blue; font-family: Arial, sans-serif; font-size: 14px;
    }
    .btn {
      margin-top: 8px; padding: 10px 15px; font-weight: bold; font-size: 18px;
      background-color: #D6FFFF; color: blue; border-radius: 10px;
      cursor: pointer; width: 100%;
    }
        .btn:not(:last-child) { margin-bottom: 10px; }

    button[type="button"] {margin-top: 10px; padding: 8px 15px; font-weight: bold; font-size: 19px;
      background-color: #b7d5ac; color: blue; border-radius: 10px;
      cursor: pointer; width: 100%; margin-bottom: 8px;
    }
    p {
      color: red; margin-top: 2px; font-size: 12px; text-align: center; padding: 2px; background-color: #ffffc5; border-radius: 5px;
    }
    #pdf-content { background-color: #D6FFFF; padding: 15px 10px; border-radius: 4px; }
    canvas#assinatura { border: 1px solid #000; border-radius: 5px; }
    .neumann { font-size: 9px; color: #24436e; text-align: right; margin-bottom: 16px; letter-spacing: 0.3px; }
    .equipe { margin-top: 3px; background-color: #dbead5; padding: 5px 3px; border-radius: 4px; color: #00498b; }
     .digital { margin-top: 7px; padding: 10px 15px; font-weight: bold; font-size: 18px;
      background-color: green; color: blue; border-radius: 10px;
      cursor: pointer; width: 100%; }
     </style>
</head>
<body>
<label for="nome" style="font-size: 8px; color:yellow; letter-spacing: 0.3px;">© 2025 Leonildo.Neumann</label>
<div id="pdf-content">
  <header class="topo">
       <div style="display:grid;
    grid-template-columns:1fr 3fr;
    gap:6px; margin-bottom:2px;">
        <div class="logo-prefeitura">
            <img src="img/logo-prefeitura.png" alt="Prefeitura">
        </div>
        <h1>SECRETARIA MUNICIPAL DE DEFESA SOCIAL<br>E MOBILIDADE</h1>
       </div>
        <h2>Departamento de Educação para o Trânsito</h2>
    </header>

  <label>LOCAL: <input type="text" name="local"></label> 
  <div class="linha-horizontal">
    <label>Data: <input type="date" name="data"></label>
    <label>Hora Início: <input type="time" name="hora_inicio"></label>
    <label>Hora Término: <input type="time" name="hora_termino"></label>
  </div>
  <div class="linha-horizontal">
    <label>SOLICITANTE: <input type="text" name="solicitante"></label>
    <label>OFÍCIO: <input type="text" name="telefone"></label>
  </div>
  <label>MATERIAIS DISTRIBUÍDOS: <input type="text" name="materiais"></label>
  <label>QUANTIDADE: <input type="text" name="quantidade"></label>
  <label>DESCRIÇAO DA ATIVIDADE: <textarea name="relatorio"></textarea></label>
  

  <div class="equipe">
    <label style="background-color: white; width: 230px; text-align: center; margin-top: 1px">Servidor Responsável:</label>
    <label>Nome: <input type="text" name="responsavel"></label>
   <div class="assinatura">
    <label>Assinaturas:</label>
    <canvas class="assinatura" width="690" height="170"></canvas>
   </div>
  </div>

  <div class="equipe">
    <label style="background-color: white; width: 230px; text-align: center; margin-top: 1px">Responsável pela Instituição:</label>
    <label>Nome: <input type="text" name="responsavel"></label>
   <div class="assinatura">
    <label>Assinaturas:</label>
    <canvas class="assinatura" width="690" height="170"></canvas>
   </div>
  </div>
  

  <p><strong>OBS:</strong> Este documento é uma coleta preliminar de dados, para controle de atendimentos de ACIDENTES/OCORRÊNCIA da SMDSM, e não substitui o registro realizado por outros órgãos.</p>

  <div class="neumann">
    <div style="position: relative;">
      <label style="position: absolute; right: 0;">© 2025 Leonildo.Neumann</label>
    </div>
  </div>
</div>

<div style="padding: 6px 10px; margin-top: 1px; background-color: #D6FFFF; border-radius: 4px">
<button class="btn" onclick="limparAssinatura()" style="background-color: white; color: #15400e; margin-top: 5px">Limpar Assinaturas</button>
</div>

<button class="btn" onclick="compartilharPDF(); this.style.backgroundColor='#D6FFFF'; this.style.color='#c0c0c0'; this.innerHTML='✅ PDF Compartilhado!';">Compartilhar PDF</button>
<button class="btn" onclick="gerarPDF(); this.style.backgroundColor='#D6FFFF'; this.style.color='#c0c0c0'; this.innerHTML='✅ PDF Baixado!';">Baixar PDF</button>



<script>
document.querySelectorAll(".assinatura").forEach(canvas => {

    const ctx = canvas.getContext("2d");
    let desenhando = false;

    function getPos(event) {
        const rect = canvas.getBoundingClientRect();

        if (event.touches) {
            return {
                x: event.touches[0].clientX - rect.left,
                y: event.touches[0].clientY - rect.top
            };
        }

        return {
            x: event.offsetX,
            y: event.offsetY
        };
    }

    function iniciar(e) {
        desenhando = true;
        const pos = getPos(e);
        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y);
    }

    function desenhar(e) {
        if (!desenhando) return;
        e.preventDefault();

        const pos = getPos(e);
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
    }

    function parar() {
        desenhando = false;
    }

    canvas.addEventListener("mousedown", iniciar);
    canvas.addEventListener("mousemove", desenhar);
    canvas.addEventListener("mouseup", parar);
    canvas.addEventListener("mouseleave", parar);

    canvas.addEventListener("touchstart", iniciar);
    canvas.addEventListener("touchmove", desenhar);
    canvas.addEventListener("touchend", parar);

    canvas.limpar = () => {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
    };
});

function limparAssinatura() {
    document.querySelectorAll(".assinatura").forEach(c => c.limpar());
}

function prepararAssinatura(clone){

    const originais = document.querySelectorAll(".assinatura");
    const clones = clone.querySelectorAll(".assinatura");

    originais.forEach((canvasOriginal, i) => {

        const assinaturaClone = clones[i];

        const img = document.createElement("img");
        img.src = canvasOriginal.toDataURL();
        img.width = canvasOriginal.width;
        img.height = canvasOriginal.height;
        img.style.border = "1px solid #000";

        assinaturaClone.parentNode.replaceChild(img, assinaturaClone);

    });

}

function gerarNomePDFComDataHora() {
  const agora = new Date();
  const data = agora.toLocaleDateString('pt-BR').split('/').reverse().join('-');
  const hora = agora.toTimeString().split(' ')[0].replace(/:/g, '-');
  return `relatorio_${data}_${hora}.pdf`;
}

function gerarPDF() {
  const original = document.getElementById('pdf-content');
  const clone = original.cloneNode(true);
  const textareas = clone.querySelectorAll('textarea');
  textareas.forEach(textarea => {
    const div = document.createElement('div');
    div.style.whiteSpace = 'pre-wrap';
    div.style.border = '1px solid #ccc';
    div.style.padding = '5px';
    div.style.minHeight = '80px';
    div.style.fontWeight = 'bold';
    div.style.fontSize = '14px';
    div.style.backgroundColor = 'white';
    div.style.color = 'blue';
    div.textContent = textarea.value;
    textarea.parentNode.replaceChild(div, textarea);
  });
  prepararAssinatura(clone);
  const container = document.createElement('div');
  container.style.position = 'absolute';
  container.style.left = '-9999px';
  container.appendChild(clone);
  document.body.appendChild(container);
  
  const opt = {
    margin: [5, 5, 5, 5],
    filename: gerarNomePDFComDataHora(),
    image: { type: 'jpeg', quality: 0.98 },
    html2canvas: { 
      scale: 3,
      useCORS: true,
      scrollY: 0,
      windowWidth: document.documentElement.scrollWidth,
      windowHeight: document.documentElement.scrollHeight
    },
pagebreak: { mode: ['avoid-all', 'css', 'legacy'] },
    
    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
  };  
  html2pdf().set(opt).from(clone).save().then(() => {
    document.body.removeChild(container);
  });
}

async function compartilharPDF() {
  const original = document.getElementById('pdf-content');
  const clone = original.cloneNode(true);

  const textareas = clone.querySelectorAll('textarea');
  textareas.forEach(textarea => {
    const div = document.createElement('div');
    div.style.whiteSpace = 'pre-wrap';
    div.style.border = '1px solid #ccc';
    div.style.padding = '5px';
    div.style.minHeight = '80px';
    div.style.fontWeight = 'bold';
    div.style.fontSize = '14px';
    div.style.backgroundColor = 'white';
    div.style.color = 'blue';
    div.textContent = textarea.value;
    textarea.parentNode.replaceChild(div, textarea);
  });

  prepararAssinatura(clone);

  const container = document.createElement('div');
  container.style.position = 'absolute';
  container.style.left = '-9999px';
  container.appendChild(clone);
  document.body.appendChild(container);

  const opt = {
    margin: [5, 5, 5, 5],
    filename: gerarNomePDFComDataHora(),
    image: { type: 'jpeg', quality: 0.98 },
    html2canvas: { 
      scale: 3,
      useCORS: true,
      scrollY: 0,
      windowWidth: document.documentElement.scrollWidth,
      windowHeight: document.documentElement.scrollHeight
    },
    pagebreak: { mode: ['avoid-all', 'css', 'legacy'] },
    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
  };

  const blob = await html2pdf().set(opt).from(clone).outputPdf('blob');

  const file = new File([blob], gerarNomePDFComDataHora(), { type: 'application/pdf' });

  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({
        title: 'Relatório de Ocorrência',
        text: 'Confira o relatório preenchido.',
        files: [file]
      });
    } catch (err) {
      alert('Compartilhamento cancelado ou falhou.');
    }
  } else {
    alert('Compartilhamento de arquivos não suportado neste navegador.');
  }

  document.body.removeChild(container);
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js')
    .then(() => console.log('Service Worker registrado com sucesso'))
    .catch(error => console.log('Erro ao registrar o Service Worker:', error));
}
</script>


</body>
</html>
